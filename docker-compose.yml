services:
  app:
    build: .
    container_name: RemoteSec
    ports:
      - "3000:3000"
      - "5000:5000"
    volumes:
      - .:/app
      # These 2 lines are CRITICAL. They prevent your host machine's empty 
      # folders from overwriting the installed modules inside the container.
      - /app/frontend/node_modules
      - /app/backend/node_modules
    environment:
      - PORT=3000